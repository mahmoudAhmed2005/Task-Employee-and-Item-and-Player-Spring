<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Add Player</title>


    <!-- CSS داخل نفس ملف HTML -->
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .page-container {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 20px;
        }


        .player-card {
            width: 100%;
            max-width: 450px;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }


        .player-card h1 {
            text-align: center;

            color: #1e293b;

            margin-bottom: 10px;
        }


        .page-description {
            text-align: center;

            color: #64748b;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            color: #334155;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .form-group input {
            width: 100%;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            outline: none;
        }


        .form-group input:focus {
            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }


        .add-button {
            width: 100%;

            padding: 13px;

            background-color: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }


        .add-button:hover {
            background-color: #1d4ed8;
        }


        .add-button:disabled {
            background-color: #94a3b8;

            cursor: not-allowed;
        }


        .message {
            min-height: 24px;

            text-align: center;

            font-weight: bold;

            margin-top: 20px;
            margin-bottom: 15px;
        }


        .success-message {
            color: #16a34a;
        }


        .error-message {
            color: #dc2626;
        }


        .back-link {
            display: block;

            text-align: center;

            color: #2563eb;

            text-decoration: none;
        }


        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<main class="page-container">

    <section class="player-card">

        <h1>Add New Player</h1>

        <p class="page-description">
            Enter the player information
        </p>


        <form id="addPlayerForm">

            <div class="form-group">

                <label for="playerName">
                    Player Name
                </label>

                <input
                        type="text"
                        id="playerName"
                        placeholder="Enter player name"
                        minlength="2"
                        required
                >

            </div>


            <div class="form-group">

                <label for="playerNumber">
                    Player Number
                </label>

                <input
                        type="number"
                        id="playerNumber"
                        placeholder="Enter player number"
                        min="1"
                        required
                >

            </div>


            <div class="form-group">

                <label for="playerSalary">
                    Player Salary
                </label>

                <input
                        type="number"
                        id="playerSalary"
                        placeholder="Enter player salary"
                        min="0.01"
                        step="0.01"
                        required
                >

            </div>


            <button
                    type="submit"
                    id="addButton"
                    class="add-button"
            >
                Add Player
            </button>

        </form>


        <p id="message" class="message"></p>


        <a href="/main.html" class="back-link">
            Back To Main Page
        </a>

    </section>

</main>


<!-- JavaScript داخل نفس ملف HTML -->
<script>

    const addPlayerForm =
        document.getElementById("addPlayerForm");

    const addButton =
        document.getElementById("addButton");

    const message =
        document.getElementById("message");


    addPlayerForm.addEventListener("submit", async function (event) {

        // منع الـForm من عمل Refresh للصفحة
        event.preventDefault();


        const player = {

            name:
                document.getElementById("playerName").value.trim(),

            number:
                Number(document.getElementById("playerNumber").value),

            salary:
                Number(document.getElementById("playerSalary").value)

        };


        message.textContent = "";

        message.className = "message";

        addButton.disabled = true;

        addButton.textContent = "Adding...";


        try {

            const response = await fetch("/players", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(player)

            });


            if (!response.ok) {

                const errorText = await response.text();

                throw new Error(
                    errorText || "Failed to add player"
                );

            }


            const savedPlayer = await response.json();


            message.textContent =
                "Player added successfully. Player ID: "
                + savedPlayer.id;


            message.className =
                "message success-message";


            // تفريغ حقول الـForm بعد نجاح الحفظ
            addPlayerForm.reset();

        } catch (error) {

            message.textContent =
                "Error: " + error.message;


            message.className =
                "message error-message";

        } finally {

            addButton.disabled = false;

            addButton.textContent = "Add Player";

        }

    });

</script>

</body>

</html>
