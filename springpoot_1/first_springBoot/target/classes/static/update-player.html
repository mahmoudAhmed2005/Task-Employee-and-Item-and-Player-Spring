<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Update Player</title>


    <!-- CSS داخل نفس الملف -->
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .page-container {
            width: 100%;

            display: flex;
            justify-content: center;
        }


        .player-card {
            width: 100%;
            max-width: 500px;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }


        .player-card h1 {
            color: #1e293b;

            text-align: center;

            margin-bottom: 10px;
        }


        .page-description {
            color: #64748b;

            text-align: center;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            color: #334155;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            font-size: 16px;

            background-color: white;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            outline: none;
        }


        .form-group input:focus,
        .form-group select:focus {
            border-color: #f59e0b;

            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }


        .form-group input:disabled {
            background-color: #e2e8f0;

            cursor: not-allowed;
        }


        .load-button,
        .update-button {
            width: 100%;

            padding: 13px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }


        .load-button {
            background-color: #2563eb;

            margin-bottom: 25px;
        }


        .load-button:hover {
            background-color: #1d4ed8;
        }


        .update-button {
            background-color: #f59e0b;
        }


        .update-button:hover {
            background-color: #d97706;
        }


        .load-button:disabled,
        .update-button:disabled {
            background-color: #94a3b8;

            cursor: not-allowed;
        }


        .divider {
            border: none;

            border-top: 1px solid #cbd5e1;

            margin-bottom: 25px;
        }


        .message {
            min-height: 24px;

            text-align: center;

            font-weight: bold;

            margin-top: 20px;
            margin-bottom: 15px;
        }


        .success-message {
            color: #16a34a;
        }


        .error-message {
            color: #dc2626;
        }


        .loading-message {
            color: #2563eb;
        }


        .back-link {
            display: block;

            text-align: center;

            color: #2563eb;

            text-decoration: none;
        }


        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<main class="page-container">

    <section class="player-card">

        <h1>Update Player</h1>

        <p class="page-description">
            Select a player and update the information
        </p>


        <!-- اختيار اللاعب -->
        <div class="form-group">

            <label for="searchPlayerId">
                Select Player
            </label>


            <select id="searchPlayerId">

                <option value="">
                    Loading players...
                </option>

            </select>

        </div>


        <button
                type="button"
                id="loadPlayerButton"
                class="load-button"
        >
            Load Player
        </button>


        <hr class="divider">


        <!-- تعديل بيانات اللاعب -->
        <form id="updatePlayerForm">

            <!-- ID مخفي -->
            <input type="hidden" id="playerId">


            <div class="form-group">

                <label for="playerName">
                    Player Name
                </label>

                <input
                        type="text"
                        id="playerName"
                        placeholder="Enter player name"
                        minlength="2"
                        required
                        disabled
                >

            </div>


            <div class="form-group">

                <label for="playerNumber">
                    Player Number
                </label>

                <input
                        type="number"
                        id="playerNumber"
                        placeholder="Enter player number"
                        min="1"
                        required
                        disabled
                >

            </div>


            <div class="form-group">

                <label for="playerSalary">
                    Player Salary
                </label>

                <input
                        type="number"
                        id="playerSalary"
                        placeholder="Enter player salary"
                        min="0.01"
                        step="0.01"
                        required
                        disabled
                >

            </div>


            <button
                    type="submit"
                    id="updateButton"
                    class="update-button"
                    disabled
            >
                Update Player
            </button>

        </form>


        <p id="message" class="message"></p>


        <a href="/main.html" class="back-link">
            Back To Main Page
        </a>

    </section>

</main>


<!-- JavaScript داخل نفس الملف -->
<script>

    const searchPlayerSelect =
        document.getElementById("searchPlayerId");

    const loadPlayerButton =
        document.getElementById("loadPlayerButton");

    const updatePlayerForm =
        document.getElementById("updatePlayerForm");

    const playerIdInput =
        document.getElementById("playerId");

    const playerNameInput =
        document.getElementById("playerName");

    const playerNumberInput =
        document.getElementById("playerNumber");

    const playerSalaryInput =
        document.getElementById("playerSalary");

    const updateButton =
        document.getElementById("updateButton");

    const message =
        document.getElementById("message");


    /*
       هنحفظ اللاعبين هنا بعد جلبهم
       من Spring Boot.
    */
    let players = [];


    /*
       عند فتح الصفحة، اجلب اللاعبين.
    */
    loadAllPlayers();


    /*
       جلب جميع اللاعبين.
    */
    async function loadAllPlayers() {

        searchPlayerSelect.innerHTML =
            '<option value="">Loading players...</option>';


        loadPlayerButton.disabled = true;


        try {

            const response = await fetch("/players");


            if (!response.ok) {

                throw new Error("Failed to load players");

            }


            players = await response.json();


            searchPlayerSelect.innerHTML =
                '<option value="">Select a player</option>';


            /*
               لو مفيش لاعبين.
            */
            if (players.length === 0) {

                searchPlayerSelect.innerHTML =
                    '<option value="">No players found</option>';


                message.textContent =
                    "No players available to update";


                message.className =
                    "message error-message";


                return;

            }


            /*
               إضافة اللاعبين إلى الـselect.
            */
            players.forEach(function (player) {

                const option =
                    document.createElement("option");


                option.value = player.id;


                option.textContent =
                    "ID: " + player.id +
                    " - Name: " + player.name;


                searchPlayerSelect.appendChild(option);

            });


            loadPlayerButton.disabled = false;


            /*
               البحث عن ID موجود في رابط الصفحة.

               مثال:
               update-player.html?id=5
            */
            const urlParameters =
                new URLSearchParams(window.location.search);


            const playerIdFromUrl =
                urlParameters.get("id");


            if (playerIdFromUrl !== null) {

                searchPlayerSelect.value =
                    playerIdFromUrl;


                /*
                   لو الـID موجود في القائمة،
                   اعرض بياناته مباشرة.
                */
                if (searchPlayerSelect.value !== "") {

                    showSelectedPlayer();

                }

            }

        } catch (error) {

            searchPlayerSelect.innerHTML =
                '<option value="">Failed to load players</option>';


            message.textContent =
                "Error: " + error.message;


            message.className =
                "message error-message";

        }

    }


    /*
       عند الضغط على Load Player.
    */
    loadPlayerButton.addEventListener(
        "click",
        function () {

            showSelectedPlayer();

        }
    );


    /*
       عرض بيانات اللاعب المختار.
    */
    function showSelectedPlayer() {

        const selectedPlayerId =
            Number(searchPlayerSelect.value);


        if (!selectedPlayerId) {

            message.textContent =
                "Please select a player";


            message.className =
                "message error-message";


            disableUpdateForm();

            return;

        }


        /*
           البحث عن اللاعب داخل Array اللاعبين.
        */
        const selectedPlayer =
            players.find(function (player) {

                return Number(player.id) === selectedPlayerId;

            });


        if (!selectedPlayer) {

            message.textContent =
                "Player not found";


            message.className =
                "message error-message";


            disableUpdateForm();

            return;

        }


        /*
           وضع بيانات اللاعب داخل الحقول.
        */
        playerIdInput.value =
            selectedPlayer.id;

        playerNameInput.value =
            selectedPlayer.name;

        playerNumberInput.value =
            selectedPlayer.number;

        playerSalaryInput.value =
            selectedPlayer.salary;


        enableUpdateForm();


        message.textContent =
            "Player loaded successfully";


        message.className =
            "message success-message";

    }


    /*
       إرسال البيانات الجديدة إلى Spring Boot.
    */
    updatePlayerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const updatedPlayer = {

                id:
                    Number(playerIdInput.value),

                name:
                    playerNameInput.value.trim(),

                number:
                    Number(playerNumberInput.value),

                salary:
                    Number(playerSalaryInput.value)

            };


            updateButton.disabled = true;

            updateButton.textContent = "Updating...";


            message.textContent =
                "Updating player...";


            message.className =
                "message loading-message";


            try {

                /*
                   إرسال PUT /players.

                   الـbody يحتوي على:
                   id, name, number, salary
                */
                const response = await fetch("/players", {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(updatedPlayer)

                });


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    throw new Error(
                        errorText || "Failed to update player"
                    );

                }


                const savedPlayer =
                    await response.json();


                message.textContent =
                    "Player updated successfully. ID: "
                    + savedPlayer.id;


                message.className =
                    "message success-message";


                /*
                   تحديث بيانات اللاعب داخل Array.
                */
                const playerIndex =
                    players.findIndex(function (player) {

                        return Number(player.id) ===
                            Number(savedPlayer.id);

                    });


                if (playerIndex !== -1) {

                    players[playerIndex] = savedPlayer;

                }


                /*
                   تحديث اسم اللاعب داخل القائمة.
                */
                const selectedOption =
                    searchPlayerSelect.options[
                        searchPlayerSelect.selectedIndex
                    ];


                selectedOption.textContent =
                    "ID: " + savedPlayer.id +
                    " - Name: " + savedPlayer.name;

            } catch (error) {

                message.textContent =
                    "Error: " + error.message;


                message.className =
                    "message error-message";

            } finally {

                updateButton.disabled = false;

                updateButton.textContent =
                    "Update Player";

            }

        }
    );


    /*
       تشغيل حقول التعديل.
    */
    function enableUpdateForm() {

        playerNameInput.disabled = false;

        playerNumberInput.disabled = false;

        playerSalaryInput.disabled = false;

        updateButton.disabled = false;

    }


    /*
       إيقاف حقول التعديل.
    */
    function disableUpdateForm() {

        playerIdInput.value = "";

        playerNameInput.value = "";

        playerNumberInput.value = "";

        playerSalaryInput.value = "";


        playerNameInput.disabled = true;

        playerNumberInput.disabled = true;

        playerSalaryInput.disabled = true;

        updateButton.disabled = true;

    }

</script>

</body>

</html>
